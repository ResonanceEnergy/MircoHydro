name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run solver unit tests
        run: python -m pytest tools/tests -q
      - name: Reference-site smoke run (calibration anchor prints)
        run: python tools/design/ram_moc_sim.py
