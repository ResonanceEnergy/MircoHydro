<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="monospace" font-size="12">
<rect width="900" height="520" fill="#fdfdf8"/>
<text x="20" y="28" font-size="16" font-weight="bold">RES-MAN-001 rev A — NOZZLE MANIFOLD TO SPEC (ENERGY_LOSS_BUDGET manifold rules)</text>
<!-- penstock arriving -->
<line x1="60" y1="80" x2="300" y2="140" stroke="#37474f" stroke-width="14"/>
<text x="60" y="66">penstock DN90 from headstock</text>
<!-- sweep -->
<path d="M 300 140 Q 420 175 480 260" fill="none" stroke="#37474f" stroke-width="14"/>
<text x="430" y="150" fill="#c62828">ONE wide sweep, bend R >= 5x bore (>= 550 mm)</text>
<!-- header straight -->
<line x1="480" y1="260" x2="700" y2="380" stroke="#1663a8" stroke-width="14"/>
<text x="470" y="300" fill="#1663a8" transform="rotate(29 470 300)">HEADER DN110 — DEAD STRAIGHT >= 3x bore (built 8x = 880 mm), aligned to N1 jet axis</text>
<!-- N1 -->
<polygon points="700,372 760,404 756,416 696,384" fill="#8d6e63" stroke="#4e342e"/>
<text x="768" y="416">N1 fixed nozzle 9.5 mm, Cv target 0.98</text>
<!-- honeycomb -->
<rect x="560" y="300" width="18" height="34" fill="none" stroke="#2e7d32" stroke-width="2" transform="rotate(29 569 317)"/>
<text x="590" y="330" fill="#2e7d32">honeycomb cell L/D 8-10 (D-6 arm C position, 5-6D before N1)</text>
<!-- wye -->
<line x1="560" y1="304" x2="660" y2="300" stroke="#37474f" stroke-width="10"/>
<text x="530" y="270">N2 wye takeoff &lt;= 30 deg — NEVER a tee</text>
<rect x="655" y="286" width="26" height="26" fill="#c9a227" stroke="#7a5c00"/>
<text x="688" y="300">N2 isolation valve (upstream of straight run)</text>
<line x1="681" y1="300" x2="790" y2="330" stroke="#37474f" stroke-width="10"/>
<polygon points="790,324 840,350 836,360 786,334" fill="#8d6e63" stroke="#4e342e"/>
<text x="700" y="352">N2 straight run &gt;= 3x bore, then nozzle 9.5 mm</text>
<!-- jets/wheel -->
<line x1="760" y1="410" x2="820" y2="440" stroke="#90caf9" stroke-width="5"/>
<circle cx="845" cy="452" r="34" fill="none" stroke="#607d8b" stroke-width="5"/>
<text x="700" y="480">jets tangent to PCD, in runner plane +/-20-25 deg; separation >= 25 deg; housing clearance: no re-strike</text>
<text x="20" y="505">Rules source: ENERGY_LOSS_BUDGET manifold spec + Finding 11 (hook counterfactual = 2.4x CoV penalty). CAD solid + tolerances = P1 package.</text>
</svg>